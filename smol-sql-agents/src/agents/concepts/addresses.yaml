concepts:
  - name: "actual_addresses"
    description: "Actual addresses are addresses with status equal to Actual in the address table"
    target:
      - "address"
    instructions: |
      When user mentions 'actual addresses', 'current addresses', or 'active addresses'
      always filter with: WHERE status = 'Actual'
      The status field in the address table contains exactly these values: Actual, Obsolete, Historical
      Never assume 'actual' means anything other than status = 'Actual'
    examples:
      - query: "find actual addresses"
        business_logic: "WHERE status = 'Actual'"
      - query: "how many actual addresses exist"
        business_logic: "SELECT COUNT(*) FROM address WHERE status = 'Actual'"

  - name: "address_joins"
    description: "How to join address to its related tables"
    target:
      - "address"
      - "address_relation"
      - "address_attribute"
      - "address_event"
      - "address_diagnostic"
    instructions: |
      address joins to related tables as follows:
      address to address_relation: address_relation.source_identity = address.entity_identity
      address to address_attribute: address_attribute.parent_identity = address.entity_identity
      NEVER join on entity_identity = entity_identity between any two tables
      address_relation and address_attribute do NOT have entity_identity as a foreign key
    examples:
      - query: "return relations of an address"
        business_logic: "SELECT ar.* FROM address a JOIN address_relation ar ON ar.source_identity = a.entity_identity"
      - query: "return attributes of an address"
        business_logic: "SELECT aa.* FROM address a JOIN address_attribute aa ON aa.parent_identity = a.entity_identity"